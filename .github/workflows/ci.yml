name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        # The runner's pip has published vulnerabilities, and the dependency audit scans every installed package.
        run: python -m pip install --upgrade pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit, integration and security tests with coverage (floor 75%)
        run: pytest -q --cov=voiceshop --cov-report=term --cov-fail-under=75
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable
      - name: Smoke test cases (one case)
        run: voiceshop --db results/ci.db eval --tags smoke --out results/ci-smoke
      - name: Targeted regression (three cases)
        run: voiceshop --db results/ci.db eval --tags targeted --out results/ci-targeted
      - name: Full regression (all cases)
        run: voiceshop --db results/ci.db eval --out results/ci-full
      - name: Regression gate against the saved baseline
        run: voiceshop regress --report results/ci-full/report.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: results/ci-*/

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the monitor
        run: pip install -e ".[dev]"
      - name: Install the browser test tools
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Browser end-to-end checks (rules router only)
        working-directory: e2e
        run: npm test
